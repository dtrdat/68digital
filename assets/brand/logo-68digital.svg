<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <!-- Gradient for '6' -->
    <linearGradient id="grad6" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E648D" />
      <stop offset="60%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>

    <!-- Gradient for '8' -->
    <linearGradient id="grad8" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F18924" />
      <stop offset="60%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON 68 LOGO MARK -->
  <g transform="translate(10, 5)">
    <!-- Tech Circuit Decorative Rings -->
    <circle cx="40" cy="40" r="38" stroke="url(#grad6)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
    
    <!-- Stylized 6: Modern Loop -->
    <path d="M 36 20 C 24 20, 16 30, 16 46 C 16 62, 24 70, 36 70 C 47 70, 53 62, 53 51 C 53 40, 45 34, 35 34 C 27 34, 20 40, 19 49" 
          fill="none" stroke="url(#grad6)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stylized 8: Infinity Intersect & Upward Arrow -->
    <path d="M 52 28 C 46 20, 56 12, 65 18 C 73 24, 60 38, 54 44 C 48 50, 42 56, 44 65 C 46 72, 56 75, 64 68 C 72 61, 74 50, 68 42" 
          fill="none" stroke="url(#grad8)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upward Growth Arrow embedded on top of 8 -->
    <path d="M 68 18 L 78 12 M 78 12 L 72 24 M 78 12 L 60 22" 
          fill="none" stroke="url(#grad8)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- High-tech Node Dots -->
    <circle cx="36" cy="20" r="4.5" fill="#48CAE4" />
    <circle cx="78" cy="12" r="4" fill="#FFB703" />
    <circle cx="53" cy="51" r="3" fill="#00B4D8" />
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(105, 18)">
    <!-- 68 Text -->
    <text x="0" y="38" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="40" letter-spacing="0.5">
      <tspan fill="url(#grad6)">6</tspan><tspan fill="url(#grad8)">8</tspan>
    </text>

    <!-- DIGITAL Text -->
    <text x="56" y="38" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="2" fill="var(--logo-text, #0E648D)">
      DIGITAL
    </text>

    <!-- Subtitle / Positioning Tagline -->
    <text x="2" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="3.5" fill="var(--logo-sub, #64748B)">
      GROWTH &amp; PERFORMANCE
    </text>
  </g>
</svg>
